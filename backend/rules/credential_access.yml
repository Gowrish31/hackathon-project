id: CRED-001
title: LSASS memory access (credential dumping)
description: A non-system process opened lsass.exe with memory-read rights, the pattern used by Mimikatz sekurlsa and similar tools to steal credentials.
severity: critical
mitre: {tactic: Credential Access, technique: T1003.001, name: "OS Credential Dumping: LSASS Memory"}
match:
  channel: sysmon
  event_id: 10
  where:
    TargetImage|endswith: \lsass.exe
    GrantedAccess|equals: ["0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff", "0x1f3fff", "0x1f1fff", "0x40"]
  not:
    SourceImage|endswith: [\MsMpEng.exe, \wininit.exe, \csrss.exe, \services.exe, \svchost.exe, \lsm.exe,
                           \wmiprvse.exe, \vmtoolsd.exe, \MsSense.exe, \Sysmon64.exe, \Sysmon.exe, \Sysmon64a.exe,
                           \taskmgr.exe, \smartscreen.exe, \NisSrv.exe, \MpDefenderCoreService.exe]
alert: "{SourceImage} read LSASS memory (access {GrantedAccess})"
---
id: CRED-002
title: LSASS dump via command line
description: A command line referencing lsass with a known dumping utility (procdump, comsvcs MiniDump, rundll32).
severity: critical
mitre: {tactic: Credential Access, technique: T1003.001, name: "OS Credential Dumping: LSASS Memory"}
match:
  channel: sysmon
  event_id: 1
  where:
    CommandLine|re: '(procdump.*lsass|comsvcs(\.dll)?.*minidump|minidump.*lsass|sekurlsa|lsadump)'
alert: "Credential dump command: {CommandLine}"
---
id: CRED-003
title: Mimikatz keywords in PowerShell
description: A PowerShell script block contains Mimikatz or credential-theft keywords.
severity: critical
mitre: {tactic: Credential Access, technique: T1003, name: OS Credential Dumping}
match:
  channel: powershell
  event_id: 4104
  where:
    ScriptBlockText|re: '(invoke-mimikatz|sekurlsa::|lsadump::|kerberos::golden|dumpcreds|invoke-kerberoast)'
alert: "Mimikatz-style PowerShell executed"
---
id: CRED-004
title: Brute-force logon attempts
description: Three or more failed logons against the same account from the same source within two minutes.
severity: high
mitre: {tactic: Credential Access, technique: T1110.001, name: "Brute Force: Password Guessing"}
match:
  channel: security
  event_id: 4625
threshold: {count: 3, window: 120, group_by: [IpAddress, Account]}
alert: "{count} failed logons ({Reason}) for {Account} from {Source}"
---
id: CRED-005
title: Password spray
description: Failed logons for five or more different accounts from one source within two minutes.
severity: high
mitre: {tactic: Credential Access, technique: T1110.003, name: "Brute Force: Password Spraying"}
match:
  channel: security
  event_id: 4625
threshold: {count: 5, window: 120, group_by: [IpAddress], distinct: TargetUserName}
alert: "Password spray from {IpAddress} ({count} failed attempts)"
---
id: CRED-006
title: Account locked out
description: An account was locked out after repeated failed logons.
severity: medium
mitre: {tactic: Credential Access, technique: T1110, name: Brute Force}
match:
  channel: security
  event_id: 4740
alert: "Account locked out: {TargetUserName}"
