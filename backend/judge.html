<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aegis · Attack the laptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f4ef; --surface: #e9ebe4; --raised: #e0e3db; --line: #c6cbc0; --line-soft: #dadfd4;
    --text: #15181b; --text-2: #3f464d; --muted: #646b72; --accent: #1f3d66; --spine: #172a45; --spine-ink: #f3f4ef; --spine-muted: #8d9bb0;
    --crit: #bf1131; --high: #bd4f08; --med: #8c6800; --ok: #1f7446;
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 "Atkinson Hyperlegible Next", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; }
  .cond { font-family: "Archivo", sans-serif; font-stretch: 85%; }
  header { background: var(--spine); color: var(--spine-ink); padding: 18px 16px 20px; }
  header .brand { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--spine-muted); }
  header h1 { margin-top: 6px; font-size: 28px; font-weight: 700; line-height: 1.1; }
  header p { margin-top: 6px; font-size: 14px; color: var(--spine-muted); }
  header .host { color: var(--spine-ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--spine-muted); }
  .dot.on { background: #4fc183; }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 0 10px; }
  .tests { display: grid; gap: 10px; }
  button.test { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px 14px 13px; color: inherit; font: inherit; cursor: pointer; }
  button.test:active { background: var(--raised); }
  button.test:disabled { opacity: .5; cursor: default; }
  button.test .row { display: flex; align-items: baseline; gap: 10px; }
  button.test b { font-size: 18px; font-family: "Archivo", sans-serif; font-stretch: 90%; }
  button.test .tech { margin-left: auto; font-size: 12px; color: var(--muted); }
  button.test p { margin-top: 4px; font-size: 14px; color: var(--text-2); }
  button.test.rw { border-left: 4px solid var(--crit); }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .err { color: var(--crit); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .run { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 16px; }
  .status { display: flex; align-items: baseline; gap: 10px; }
  .status .t { font-size: 22px; font-weight: 700; }
  .badge { margin-left: auto; font-size: 13px; font-weight: 700; border: 1.5px solid currentColor; border-radius: 99px; padding: 1px 10px; white-space: nowrap; }
  ol.steps { list-style: none; padding: 0; margin-top: 14px; }
  ol.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 16px; }
  .mark { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--bg); }
  .mark.done { background: var(--ok); border-color: var(--ok); color: var(--bg); }
  .mark.fail { border-color: var(--crit); color: var(--crit); }
  .mark.active { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(31,61,102,.18); } }
  @media (prefers-reduced-motion: reduce) { .mark.active { animation: none; } }
  li.todo span.l { color: var(--muted); }
  .at { font-size: 13px; color: var(--muted); }
  .case { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px; }
  .case .rule { font-weight: 700; }
  .case .tech { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .kill { margin-top: 10px; color: var(--ok); font-weight: 700; font-size: 15px; }
  .ai { margin-top: 14px; border-left: 3px solid var(--med); padding-left: 10px; }
  .ai .v { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .ai .h { font-weight: 700; margin-top: 2px; }
  .ai .s { font-size: 14px; color: var(--text-2); margin-top: 4px; }
  .ai .by { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .gone { padding: 40px 16px; text-align: center; color: var(--text-2); }
  footer { padding: 24px 16px 40px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="brand">Aegis · Windows SIEM + EDR</div>
  <h1 class="cond">Attack our laptop</h1>
  <p id="hostline">Connecting…</p>
</header>
<main id="app" aria-live="polite"></main>
<footer>Every drill is harmless: it only runs simulations on our own demo laptop.</footer>
<script>
(() => {
  const token = location.pathname.split("/").filter(Boolean).pop();
  const base = `/api/judge/${encodeURIComponent(token)}`;
  const app = document.getElementById("app");
  const hostline = document.getElementById("hostline");
  let state = null, err = "", busy = false, timer = null;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const plus = (a, b) => (a && b ? `+${((Date.parse(b) - Date.parse(a)) / 1000).toFixed(1)} s` : "");
  const online = (iso) => iso && Date.now() - Date.parse(iso) < 20000;
  const VERDICT = { malicious: ["Malicious", "var(--crit)"], suspicious: ["Suspicious", "var(--med)"], likely_benign: ["Likely benign", "var(--ok)"] };

  async function load() {
    try {
      const r = await fetch(`${base}/state`, { cache: "no-store" });
      if (r.status === 404) return expired();
      state = await r.json();
      render();
    } catch { hostline.textContent = "Connection lost, retrying…"; }
    schedule();
  }
  function schedule() {
    clearTimeout(timer);
    const running = state?.run?.status === "running" || (state?.run && state.run.status !== "running" && !state.run.case?.ai && state.run.case);
    timer = setTimeout(load, running ? 900 : 3000);
  }
  function expired() {
    clearTimeout(timer);
    hostline.textContent = "Session ended";
    app.innerHTML = `<div class="gone"><p class="cond" style="font-size:22px;font-weight:700;color:var(--text)">This link has expired.</p><p style="margin-top:6px">Ask the team for a fresh QR code.</p></div>`;
  }
  async function fire(id) {
    if (busy) return;
    busy = true; err = ""; render();
    try {
      const r = await fetch(`${base}/run`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ test: id }) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 404) return expired();
      if (!r.ok) err = d.detail || "That did not work. Try again.";
      else state = d;
    } catch { err = "Network problem. Try again."; }
    busy = false; render(); schedule();
  }

  function render() {
    if (!state) return;
    const on = online(state.last_seen);
    hostline.innerHTML = `<span class="dot ${on ? "on" : ""}"></span>Target: <span class="host mono">${esc(state.host)}</span> · ${on ? "online" : "offline"}`;
    const run = state.run;
    const running = run?.status === "running";
    const block = busy || running || state.cooldown > 0 || state.runs_left <= 0 || !on;
    let h = `<h2>Pick an attack</h2><div class="tests">` + state.tests.map((t) => `
      <button class="test ${t.id === "ransomware_sim" ? "rw" : ""}" data-id="${esc(t.id)}" ${block ? "disabled" : ""}>
        <div class="row"><b>${esc(t.title)}</b><span class="tech mono">${esc(t.technique)}</span></div>
        <p>${esc(t.description)}</p>
      </button>`).join("") + `</div>`;
    h += `<p class="err" role="alert">${esc(err)}</p>`;
    if (!on) h += `<p class="note">The laptop is not reporting right now. Ask the team to wake it.</p>`;
    else if (running) h += `<p class="note">Watch the big screen while this runs.</p>`;
    else if (state.cooldown > 0) h += `<p class="note">Next drill in ${state.cooldown} s.</p>`;

    if (run) {
      const col = run.status === "passed" ? "var(--ok)" : run.status === "failed" ? "var(--crit)" : "var(--accent)";
      const badge = run.status === "passed" ? `Caught in ${run.seconds.toFixed(1)} s` : run.status === "failed" ? "Missed" : "Running";
      h += `<section class="run"><div class="status"><span class="t cond">${esc(run.title)}</span><span class="badge" style="color:${col}">${esc(badge)}</span></div>
        <ol class="steps">` + run.steps.map((s, i) => `
          <li class="${esc(s.state)}"><span class="mark ${esc(s.state)}">${s.state === "done" ? "&#10003;" : s.state === "fail" ? "!" : i + 1}</span>
          <span class="l">${esc(s.label)}</span><span class="at mono">${s.state === "done" && i > 0 ? plus(run.started_at, s.at) : s.state === "active" ? "waiting" : ""}</span></li>`).join("") + `</ol>`;
      const c = run.case;
      if (c) {
        h += `<div class="case"><div class="rule">${esc(c.rule)}</div><div class="tech mono">${esc(c.technique)} · ${esc(c.technique_name)}</div>`;
        if (c.killed) h += `<div class="kill">${esc(c.killed)}</div>`;
        if (c.ai) {
          const [vl, vc] = VERDICT[c.ai.verdict] || VERDICT.suspicious;
          h += `<div class="ai" style="border-color:${vc}"><div class="v" style="color:${vc}">${esc(vl)}</div><div class="h">${esc(c.ai.headline)}</div><div class="s">${esc(c.ai.story)}</div>
            <div class="by">${c.ai.source === "groq" ? "Written by the Aegis AI analyst" : "Case summary"}</div></div>`;
        } else h += `<p class="note">The AI analyst is writing it up…</p>`;
        h += `</div>`;
      }
      h += `</section>`;
    }
    app.innerHTML = h;
    app.querySelectorAll("button.test").forEach((b) => b.addEventListener("click", () => fire(b.dataset.id)));
  }
  load();
})();
</script>
</body>
</html>
